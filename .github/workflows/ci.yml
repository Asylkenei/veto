name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Migrations upgrade/downgrade round-trip
        run: |
          export DATABASE_URL=sqlite:////tmp/ci.db
          python -m alembic upgrade head && python -m alembic downgrade base && python -m alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t veto:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name veto -p 8000:8000 veto:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/meta
          curl -fs localhost:8000/ | grep -q '<div id="root">'
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag veto:${{ github.sha }} $IMAGE:${{ github.sha }} && docker tag veto:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }} && docker push $IMAGE:latest
