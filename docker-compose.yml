# Production stack on the VM (deployed by .gitlab-ci.yml):
# nginx :80 → frontend (SPA) and backend (/api, /media) → PostgreSQL.
# Required variables come from GitLab CI; optional ones may stay empty.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 1m
    logging: *logging
    networks:
      - app

  backend:
    image: ${IMAGE_BACKEND:?Set IMAGE_BACKEND in the deployment environment}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /data
      ENVIRONMENT: production
      APP_VERSION: ${APP_VERSION:-dev}
      # Public address used in e-mail links; cookies follow X-Forwarded-Proto (HTTP now).
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Optional: password recovery and support e-mails (disabled while SMTP_HOST is empty)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-VETO <no-reply@veto.app>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@veto.app}
      # Optional: better photos for generic ideas (Wikimedia works without keys)
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@veto.app}
    volumes:
      # Cached photos and the Web Push key survive redeploys
      - backend_data:/data
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      # First start runs Alembic migrations and seeds the places catalogue
      start_period: 40s
    logging: *logging
    networks:
      - app

  frontend:
    image: ${IMAGE_FRONTEND:?Set IMAGE_FRONTEND in the deployment environment}
    restart: unless-stopped
    expose:
      - "8080"
    logging: *logging
    networks:
      - app

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging
    networks:
      - app

volumes:
  postgres_data:
  backend_data:

networks:
  app:
