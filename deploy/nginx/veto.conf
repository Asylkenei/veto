# Optional reverse proxy (TLS terminates here). Push notifications require HTTPS.
server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Server-Sent Events: no buffering, long-lived connections
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8000; }
  location / { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
