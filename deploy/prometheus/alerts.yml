groups:
  - name: veto
    rules:
      - alert: VetoDown
        expr: up{job="veto"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "VETO API не отвечает" }
      - alert: VetoHigh5xx
        expr: sum(rate(veto_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(veto_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Больше 5% ответов с ошибкой 5xx" }
      - alert: VetoSlowP95
        expr: histogram_quantile(0.95, sum by (le) (rate(veto_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 задержки API выше 500 мс" }
